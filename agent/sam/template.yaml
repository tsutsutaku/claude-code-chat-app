AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Claude ChatAgent - Lambda Function URL (RESPONSE_STREAM)"
# InvokeMode RESPONSE_STREAM は Lambda Function URL 専用。API Gateway Integration には未対応。

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: ANTHROPIC_API_KEY
  LangfuseSecretKey:
    Type: String
    NoEcho: true
    Default: ""
  LangfusePublicKey:
    Type: String
    Default: ""
  LangfuseBaseUrl:
    Type: String
    Default: ""

Globals:
  Function:
    Timeout: 900
    MemorySize: 1024
    Architectures:
      - arm64

Resources:
  ChatAgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../app/ChatAgent/
      Handler: dist/lambda-handler.handler
      Runtime: nodejs22.x
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          LANGFUSE_SECRET_KEY: !Ref LangfuseSecretKey
          LANGFUSE_PUBLIC_KEY: !Ref LangfusePublicKey
          LANGFUSE_BASE_URL: !Ref LangfuseBaseUrl
          WORKSPACE_PATH: /tmp/workspace
          NODE_OPTIONS: --enable-source-maps
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - content-type
            - authorization
            - x-api-key

Outputs:
  AgentApiUrl:
    Description: Amplify の AGENT_API_URL に設定（末尾スラッシュなし）。POST /invocations で SSE。
    Value: !GetAtt ChatAgentFunctionUrl.FunctionUrl
  ChatAgentFunctionArn:
    Value: !GetAtt ChatAgentFunction.Arn

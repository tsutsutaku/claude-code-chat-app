version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - node --version
            - npm ci
            # エージェントの cwd として必要な空ディレクトリを用意
            - mkdir -p workspace/kurewari
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: chat-app

# AWS Amplify Hosting（公式: https://docs.aws.amazon.com/amplify/latest/userguide/ ）
#
# 【appRoot】ビルドのカレントはリポジトリ内のこのディレクトリ（= chat-app）。
# 【アーキテクチャ】バックエンドは Lambda + API Gateway。本アプリは薄い HTTP プロキシ + フロント。
#   ブラウザ → POST /api/chat → fetch(API Gateway /invocations) → Lambda(Claude Agent SDK)
# 【必須環境変数】
#   AGENT_API_URL        : sam deploy 後の HttpApiUrl（末尾スラッシュなし）
#   NEXT_PUBLIC_*        : クライアント側公開変数（Langfuse など）
# 【オプション】
#   AGENT_API_KEY        : API Gateway で API キーを有効にした場合
#   AGENTCORE_LOCAL_URL  : ローカルで ChatAgent を直叩きする場合（本番では未設定）
version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - node --version
            - npm ci
        build:
          commands:
            - rm -f .env.production
            - env | grep -e '^NEXT_PUBLIC_' >> .env.production || true
            - env | grep -e '^AGENT_' >> .env.production || true
            - env | grep -e '^AGENTCORE_LOCAL_URL=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: chat-app

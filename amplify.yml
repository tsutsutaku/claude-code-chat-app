version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - node --version
            - npm ci
            # エージェントの cwd として必要な空ディレクトリを用意
            - mkdir -p workspace/kurewari
        build:
          commands:
            # Amplify コンソールの環境変数を Next.js のビルドに渡す（必要なキーのみ）
            - rm -f .env.production
            - env | grep -e '^ANTHROPIC_' >> .env.production || true
            - env | grep -e '^LANGFUSE_' >> .env.production || true
            - env | grep -e '^NEXT_PUBLIC_' >> .env.production || true
            - env | grep -e '^WORKSPACE_PATH=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: chat-app

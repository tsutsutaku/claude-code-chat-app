version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - node --version
            - npm ci
        build:
          commands:
            - npm run build
            # standalone バンドルに空の workspace を含める（エージェントの cwd として必要）
            - mkdir -p .next/standalone/workspace/kurewari
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: chat-app
